<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baroc Hotel - Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .menu-container {
            margin-top: 100px;
        }

        .menu-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: white;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .menu-page img {
            max-width: 100%;
            max-height: calc(100vh - 140px);
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .navigation {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 5px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .page-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            z-index: 1000;
            font-size: 16px;
        }

        @media print {
            .header, .navigation, .page-indicator {
                display: none;
            }
            .menu-page {
                page-break-after: always;
                box-shadow: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            .menu-container {
                margin-top: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Baroc Hotel</h1>
        <p>Restaurant Menu</p>
    </div>

    <div class="menu-container">
        <!-- Page 1: Salads & Burgers -->
        <div class="menu-page">
            <img src="menu page-1.png" alt="Baroc Hotel Menu - Salads and Burgers">
        </div>

        <!-- Page 2: Breakfast -->
        <div class="menu-page">
            <img src="menu page-2.png" alt="Baroc Hotel Menu - Breakfast">
        </div>

        <!-- Page 3: Special Foods & Fasting -->
        <div class="menu-page">
            <img src="menu page-3.png" alt="Baroc Hotel Menu - Special Foods">
        </div>

        <!-- Page 4: Pizza, Fish & Soup -->
        <div class="menu-page">
            <img src="menu page-4.png" alt="Baroc Hotel Menu - Pizza and Fish">
        </div>

        <!-- Page 5: Sandwich & Traditional -->
        <div class="menu-page">
            <img src="menu page-5.png" alt="Baroc Hotel Menu - Sandwiches">
        </div>

        <!-- Page 6: Spirits -->
        <div class="menu-page">
            <img src="menu page-6.png" alt="Baroc Hotel Menu - Spirits">
        </div>

        <!-- Page 7: Vodka & Cognac -->
        <div class="menu-page">
            <img src="menu page-7.png" alt="Baroc Hotel Menu - Vodka and Cognac">
        </div>

        <!-- Page 8: Whisky -->
        <div class="menu-page">
            <img src="menu page-8.png" alt="Baroc Hotel Menu - Whisky">
        </div>

        <!-- Page 9: Juice & Coffee -->
        <div class="menu-page">
            <img src="menu page-9.png" alt="Baroc Hotel Menu - Juice and Coffee">
        </div>

        <!-- Page 10: Soft Drinks & Wine -->
        <div class="menu-page">
            <img src="menu page-10.png" alt="Baroc Hotel Menu - Soft Drinks">
        </div>
    </div>

    <div class="page-indicator">
        Page <span id="current-page">1</span> of <span id="total-pages">10</span>
    </div>

    <div class="navigation">
        <button class="nav-btn" onclick="scrollToPage('prev')">← Previous</button>
        <button class="nav-btn" onclick="scrollToPage('next')">Next →</button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 10;
        const pages = document.querySelectorAll('.menu-page');

        function updatePageIndicator() {
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
        }

        function scrollToPage(direction) {
            if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
                pages[currentPage - 1].scrollIntoView({ behavior: 'smooth' });
            } else if (direction === 'prev' && currentPage > 1) {
                currentPage--;
                pages[currentPage - 1].scrollIntoView({ behavior: 'smooth' });
            }
            updatePageIndicator();
        }

        // Update current page on scroll
        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY + window.innerHeight / 2;
            
            pages.forEach((page, index) => {
                const pageTop = page.offsetTop;
                const pageBottom = pageTop + page.offsetHeight;
                
                if (scrollPosition >= pageTop && scrollPosition < pageBottom) {
                    if (currentPage !== index + 1) {
                        currentPage = index + 1;
                        updatePageIndicator();
                    }
                }
            });
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'PageDown') {
                scrollToPage('next');
            } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
                scrollToPage('prev');
            }
        });

        // Initialize
        updatePageIndicator();
    </script>
</body>
</html>
